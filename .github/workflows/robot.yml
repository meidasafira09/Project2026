name: Robot Framework CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Build and Run Tests
        run: |
          docker compose up --build --abort-on-container-exit

      - name: Upload Robot Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: result_report/

      - name: Send Slack Notification
        if: always()
        run: |
          PASS=$(grep -oP 'pass="\K[0-9]+' result_report/output.xml | head -1)
          FAIL=$(grep -oP 'fail="\K[0-9]+' result_report/output.xml | head -1)

          STATUS="✅ PASSED"
          if [ "$FAIL" != "0" ]; then
            STATUS="❌ FAILED"
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🤖 Robot Test Result\nStatus: $STATUS\nPassed: $PASS\nFailed: $FAIL\nDetails: $RUN_URL\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}