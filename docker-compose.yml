version: "3"

services:
  selenium:
    image: selenium/standalone-chrome:4.18.1
    ports:
      - "4444:4444"

  robot:
    build: .
    depends_on:
      - selenium
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: >
      sh -c "
      sleep 10 &&
      robot --outputdir result_report .
      "